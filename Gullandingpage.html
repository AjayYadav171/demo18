<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f4f9, #d7e3fc);
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      color: #333;
      font-size: 2.5em;
    }

    p {
      font-size: 1.2em;
      color: #555;
      margin: 20px 0;
    }

    a {
      text-decoration: none;
      color: white;
      background-color: #4285F4;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 1.1em;
      transition: 0.3s;
    }

    a:hover {
      background-color: #3367D6;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Webpage</h1>
  <p>Click the button below to visit Google:</p>

  <a href="https://www.google.com" target="_blank">Go to Google</a>

</body>
</html>
